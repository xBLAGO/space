{
  "name": "Safe CI",
  "on": {
    "push": {
      "branches": [
        "main",
        "feat/**",
        "fix/**",
        "docs/**",
        "integration/**"
      ]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "baseline": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install unchanged main dependencies",
          "run": "python -m pip install ."
        },
        {
          "name": "Baseline tests and release negatives (synthetic only)",
          "run": "PYTHONPATH=.:src python -m unittest discover -s tests -v"
        },
        {
          "name": "Verify baseline and build source artifact without starting application",
          "run": "python tools/release_guard.py build --output \"$RUNNER_TEMP/source-candidate\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "blago-source-candidate",
            "path": "${{ runner.temp }}/source-candidate",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ],
      "name": "Release guard / baseline"
    }
  }
}

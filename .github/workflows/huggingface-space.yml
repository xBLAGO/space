{
  "name": "Prepare source release (NO DEPLOYMENT)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_sha": {
          "description": "Exact current main SHA (40 lowercase hex)",
          "required": true,
          "type": "string"
        },
        "ci_run_id": {
          "description": "Successful Safe CI push/main run ID",
          "required": true,
          "type": "string"
        },
        "artifact_id": {
          "description": "Confirmed blago-source-candidate artifact ID",
          "required": true,
          "type": "string"
        },
        "artifact_digest": {
          "description": "Exact GitHub artifact ZIP digest sha256:...",
          "required": true,
          "type": "string"
        },
        "config_digest": {
          "description": "SHA256 of release/config.json from selected source",
          "required": true,
          "type": "string"
        },
        "confirmation": {
          "description": "Type PREPARE_SOURCE_ONLY; this never deploys",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "blago-release-preparation-main",
    "cancel-in-progress": false
  },
  "jobs": {
    "prepare": {
      "if": "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'xBLAGO/space' && vars.BLAGO_RELEASE_PREPARATION_ENABLED == 'true' }}",
      "environment": "production-release",
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Verify source/artifact/config/actor and reserve immutable preparation intent only",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "PREPARATION_ENABLED": "${{ vars.BLAGO_RELEASE_PREPARATION_ENABLED }}",
            "REQUEST_SOURCE_SHA": "${{ inputs.source_sha }}",
            "REQUEST_CI_RUN_ID": "${{ inputs.ci_run_id }}",
            "REQUEST_ARTIFACT_ID": "${{ inputs.artifact_id }}",
            "REQUEST_ARTIFACT_DIGEST": "${{ inputs.artifact_digest }}",
            "REQUEST_CONFIG_DIGEST": "${{ inputs.config_digest }}",
            "REQUEST_CONFIRMATION": "${{ inputs.confirmation }}"
          },
          "run": "python tools/release_guard.py prepare"
        }
      ]
    }
  }
}

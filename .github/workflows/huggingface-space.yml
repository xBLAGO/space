name: Deploy Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to publish this commit to the configured Hugging Face Space."
        required: true
        type: string
      release_sha:
        description: "Exact reviewed main commit; this does not approve migrations."
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY' && inputs.release_sha == github.sha && vars.BLAGO_DEPLOYMENT_ENABLED == 'true' }}
    environment: production-release
    runs-on: ubuntu-latest
    concurrency:
      group: huggingface-space-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify explicit release authority before credentials
        env:
          BLAGO_RELEASE_SHA: ${{ inputs.release_sha }}
          BLAGO_CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
          BLAGO_DEPLOYMENT_ENABLED: ${{ vars.BLAGO_DEPLOYMENT_ENABLED }}
        run: python tools/release_guard.py

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Check Hugging Face access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is empty or missing in GitHub Actions."
            exit 1
          fi

          echo "::add-mask::$HF_TOKEN"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          user = HfApi(token=os.environ["HF_TOKEN"]).whoami()
          print(f"Authenticated to Hugging Face as: {user.get('name', 'unknown')}")
          PY

      - name: Prepare Space bundle
        run: |
          mkdir -p "$RUNNER_TEMP/space"
          cp -R src "$RUNNER_TEMP/space/src"
          cp Dockerfile pyproject.toml requirements-integration.lock "$RUNNER_TEMP/space/"
          mkdir -p "$RUNNER_TEMP/space/tools"
          cp tools/build_sqlite.py "$RUNNER_TEMP/space/tools/build_sqlite.py"
          cp deploy/huggingface-space/README.md "$RUNNER_TEMP/space/README.md"
          find "$RUNNER_TEMP/space" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/space" -type f -name "*.pyc" -delete
          find "$RUNNER_TEMP/space" -maxdepth 2 -type f -print | sort

      - name: Upload Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO || 'RomanMaloev/space' }}
        run: |
          python - <<'PY'
          import os
          import sys
          import traceback
          from huggingface_hub import HfApi

          try:
              commit = HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
                  repo_id=os.environ["HF_SPACE_REPO"],
                  repo_type="space",
                  folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space"),
                  commit_message="Deploy from GitHub Actions",
              )
          except Exception as exc:
              print(f"::error::Hugging Face upload failed: {type(exc).__name__}: {exc}")
              traceback.print_exc()
              sys.exit(1)

          print(f"Uploaded Space commit: {commit}")
          PY

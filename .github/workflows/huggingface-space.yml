name: Deploy Hugging Face Space

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Check Hugging Face access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is empty or missing in GitHub Actions."
            exit 1
          fi

          echo "::add-mask::$HF_TOKEN"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          user = HfApi(token=os.environ["HF_TOKEN"]).whoami()
          print(f"Authenticated to Hugging Face as: {user.get('name', 'unknown')}")
          PY

      - name: Prepare Space bundle
        run: |
          mkdir -p "$RUNNER_TEMP/space"
          cp -R src "$RUNNER_TEMP/space/src"
          cp Dockerfile pyproject.toml "$RUNNER_TEMP/space/"
          cp deploy/huggingface-space/README.md "$RUNNER_TEMP/space/README.md"
          find "$RUNNER_TEMP/space" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/space" -type f -name "*.pyc" -delete
          find "$RUNNER_TEMP/space" -maxdepth 2 -type f -print | sort

      - name: Upload Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO || 'RomanMaloev/space' }}
        run: |
          python - <<'PY'
          import os
          import sys
          import traceback
          from huggingface_hub import HfApi

          try:
              commit = HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
                  repo_id=os.environ["HF_SPACE_REPO"],
                  repo_type="space",
                  folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space"),
                  commit_message="Deploy from GitHub Actions",
              )
          except Exception as exc:
              print(f"::error::Hugging Face upload failed: {type(exc).__name__}: {exc}")
              traceback.print_exc()
              sys.exit(1)

          print(f"Uploaded Space commit: {commit}")
          PY

name: Tests

on:
  push:
    branches: ["feat/**", "fix/**"]
  pull_request:
    branches: ["main", "feat/foundation-04-semantic-memory", "fix/foundation-04-memory-pilot", "feat/foundation-05-identity-store", "feat/foundation-05-secure-identity-runtime"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Record SQLite runtime for security review
        run: python -c 'import sqlite3; print("SQLite runtime:", sqlite3.sqlite_version)'
      - name: Check Python syntax
        run: python -m compileall -q src tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t xblago-space:${{ github.sha }} .
      - name: Run Docker health check
        run: |
          cleanup() {
            docker logs xblago-space-smoke || true
            docker stop xblago-space-smoke || true
          }
          trap cleanup EXIT

          docker run --rm -d \
            --name xblago-space-smoke \
            -p 7860:7860 \
            -e TELEGRAM_BOT_TOKEN=123:ci-smoke-token \
            -e TELEGRAM_DELIVERY_MODE=webhook \
            -e TELEGRAM_WEBHOOK_URL=http://127.0.0.1:7860/telegram/ci-smoke \
            -e TELEGRAM_WEBHOOK_SECRET=ci-smoke \
            -e TELEGRAM_SKIP_STARTUP_CHECK=true \
            -e TELEGRAM_SKIP_WEBHOOK_REGISTRATION=true \
            -e XBLAGO_WEB_INVITE_CODE=ci-release-smoke-invite \
            -e XBLAGO_COOKIE_SECURE=false \
            xblago-space:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/healthz \
              && curl -fsS http://127.0.0.1:7860/app >/dev/null \
              && curl -fsS http://127.0.0.1:7860/app/manifest.webmanifest >/dev/null \
              && curl -fsS http://127.0.0.1:7860/app/sw.js >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          exit 1
      - name: Docker Identity Runtime smoke (temporary SQLite only)
        run: |
          docker run --rm -i --entrypoint python \
            -e XBLAGO_WEB_INVITE_CODE=ci-synthetic-identity-invite \
            -e XBLAGO_REQUIRE_SECURE_IDENTITY=true \
            xblago-space:${{ github.sha }} - <<'PY'
          import tempfile
          from pathlib import Path
          from xblago.core.storage import SQLiteBlagoStore
          from xblago.core.identity_schema import migrate_identity_store
          from xblago.core.identity_runtime_schema import migrate_identity_runtime
          from xblago.integrations.web import WebApp
          with tempfile.TemporaryDirectory() as root:
              path = Path(root) / 'ci-only.sqlite3'
              app = WebApp(SQLiteBlagoStore(path))
              migrate_identity_store(path)
              assert migrate_identity_runtime(path)
              assert not migrate_identity_runtime(path)
              token, csrf = app.register('ci_identity', 'ci-only-long-password', 'ci-synthetic-identity-invite')
              assert app.session(token)[1] == csrf
              assert len(app.identity.sessions(token)) == 1
              replacement, _ = app.login('ci_identity', 'ci-only-long-password', token)
              assert WebApp(SQLiteBlagoStore(path)).session(replacement)
              backup = app.store.backup_database()
              assert WebApp(SQLiteBlagoStore(backup)).session(replacement)
              print('Identity runtime, restart and backup smoke OK')
          PY
      - name: Docker Privacy Recovery smoke (temporary stores only)
        run: |
          docker run --rm -i --entrypoint python \
            -e XBLAGO_WEB_INVITE_CODE=ci-privacy-only-invite \
            xblago-space:${{ github.sha }} - <<'PY'
          import os, sqlite3, tempfile
          from pathlib import Path
          from xblago.core.storage import SQLiteBlagoStore
          from xblago.core.identity_schema import migrate_identity_store
          from xblago.core.identity_runtime_schema import migrate_identity_runtime
          from xblago.core.privacy_schema import migrate_privacy
          from xblago.core.security_journal import SecurityJournal
          from xblago.core.privacy_maintenance import restore, cleanup
          from xblago.integrations.web import WebApp
          from xblago.integrations.privacy import PrivacyService
          with tempfile.TemporaryDirectory() as root:
              path = Path(root) / 'ci-app.sqlite3'
              journal = Path(root) / 'independent-control'
              app = WebApp(SQLiteBlagoStore(path))
              migrate_identity_store(path)
              migrate_identity_runtime(path)
              SecurityJournal.initialize(journal)
              assert migrate_privacy(path, journal)
              os.environ['XBLAGO_SECURITY_JOURNAL_DIR'] = str(journal)
              os.environ['XBLAGO_REQUIRE_PRIVACY_JOURNAL'] = 'true'
              token, _ = app.register('privacy_ci', 'ci-privacy-long-password', 'ci-privacy-only-invite')
              uid = app.session(token)[0]
              app.store.memory_for_user(uid).set('city', 'Kazan')
              backup = app.store.backup_database()
              app.store.delete_memory(uid, 'city')
              recovered = restore(backup, journal)
              assert recovered.all_memory(uid) == {}
              replacement, _ = app.login('privacy_ci', 'ci-privacy-long-password')
              privacy = PrivacyService(app)
              assert privacy.export(replacement)['blago_user_id'] == uid
              preview = privacy.preview(replacement)
              assert privacy.delete(replacement, preview['challenge'], 'УДАЛИТЬ')['deleted']
              cleanup(app.store)
              assert WebApp(SQLiteBlagoStore(backup)).store.all_memory(uid) == {}
              SecurityJournal(journal).read()
              print('SQLite runtime:', sqlite3.sqlite_version)
              print('Privacy journal, export, delete, TTL and restore smoke OK')
          PY

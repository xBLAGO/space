name: Tests

on:
  push:
    branches: ["feat/**", "fix/**", "integration/**"]
  pull_request:
    branches: ["integration/foundation-02-unified-mvp", "feat/privacy-01-4-operational-retention", "feat/privacy-01-3-data-lifecycle", "fix/privacy-01-2-context-fencing", "feat/foundation-help-01-1", "feat/foundation-help-01", "integration/foundation-01-06-1", "main", "feat/foundation-04-semantic-memory", "fix/foundation-04-memory-pilot", "feat/foundation-05-identity-store", "feat/foundation-05-secure-identity-runtime", "feat/foundation-05-privacy-recovery", "feat/foundation-06-human-interface-05-4"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install -r requirements-integration.lock
          python -m pip install --no-deps -e .
      - name: Build verified patched SQLite (no system replacement)
        run: |
          python tools/build_sqlite.py --prefix "$RUNNER_TEMP/blago-sqlite"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/blago-sqlite" >> "$GITHUB_ENV"
          echo "LD_PRELOAD=$RUNNER_TEMP/blago-sqlite/libsqlite3.so.0" >> "$GITHUB_ENV"
      - name: Block unverified pilot SQLite
        run: python -m xblago.core.sqlite_safety --require-safe
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify immutable integration manifests
        run: PYTHONPATH=.:src python -m tools.freeze_integration
      - name: Integration public evidence
        env:
          BLAGO_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PYTHONPATH=.:src python -m tools.integration_evidence --output "$RUNNER_TEMP/integration-evidence.json"
      - name: Record SQLite runtime for security review
        run: python -c 'import sqlite3; print("SQLite runtime:", sqlite3.sqlite_version)'
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Install browser acceptance tool
        run: python -m pip install playwright==1.64.1
      - name: Real Chrome WebAuthn UI (virtual CTAP2, synthetic localhost)
        run: python tools/pilot_browser_check.py --chrome "$(command -v google-chrome)" --output "$RUNNER_TEMP/browser-evidence" --integration
      - name: Help 01 two-person browser cycle
        run: PYTHONPATH=.:src python -m tools.help_browser_check --chrome "$(command -v google-chrome)" --output "$RUNNER_TEMP/help-browser"
      - name: Help 01 completed synthetic demonstration
        run: PYTHONPATH=.:src python -m tools.help_demo --output "$RUNNER_TEMP/help-demo.json"
      - name: Help 01.1 synthetic Mini App and mobile emulation (not physical devices)
        run: PYTHONPATH=.:src python -m tools.help_mobile_check --chrome "$(command -v google-chrome)" --output "$RUNNER_TEMP/help-mobile"
      - name: Verify G09 cross-worker context fencing (synthetic only)
        run: PYTHONPATH=.:src python -m tools.help_worker_probe --output "$RUNNER_TEMP/help-worker-probe.json"
      - name: Context fencing synthetic latency and multiprocess proof
        run: PYTHONPATH=.:src python -m tools.context_fencing_check --output "$RUNNER_TEMP/context-fencing-check.json"
      - name: Privacy 01.3 lifecycle inventory and restore rehearsal
        run: |
          PYTHONPATH=.:src python -m tools.lifecycle_inventory --output "$RUNNER_TEMP/lifecycle-inventory.json"
          PYTHONPATH=.:src python -m tools.lifecycle_check --output "$RUNNER_TEMP/lifecycle-check.json"
      - name: Privacy 01.4 operational retention and linkage attacks (synthetic only)
        run: PYTHONPATH=.:src python -m tools.retention_ops_lab --output "$RUNNER_TEMP/retention-ops-lab.json"
      - name: Collective Calculator offline accounting demonstration
        run: PYTHONPATH=.:src python -m tools.collective_calculator_lab --output "$RUNNER_TEMP/calculator-lab.json"
      - name: Integration 02 one-database cross-channel user journey
        run: PYTHONPATH=.:src python -m tools.unified_mvp_check --output "$RUNNER_TEMP/unified-mvp-check.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-browser-evidence
          path: |
            ${{ runner.temp }}/browser-evidence
            ${{ runner.temp }}/integration-evidence.json
            ${{ runner.temp }}/help-browser
            ${{ runner.temp }}/help-demo.json
            ${{ runner.temp }}/help-mobile
            ${{ runner.temp }}/help-worker-probe.json
            ${{ runner.temp }}/context-fencing-check.json
            ${{ runner.temp }}/lifecycle-inventory.json
            ${{ runner.temp }}/lifecycle-check.json
            ${{ runner.temp }}/retention-ops-lab.json
            ${{ runner.temp }}/unified-mvp-check.json
            ${{ runner.temp }}/calculator-lab.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build Docker image
        run: docker build -t xblago-space:${{ github.sha }} .
      - name: Record isolated image identity
        run: docker image inspect xblago-space:${{ github.sha }} --format '{{.Id}}'
      - name: Verify actual Docker Python SQLite
        run: docker run --rm --entrypoint python xblago-space:${{ github.sha }} -m xblago.core.sqlite_safety --require-safe
      - name: Run Docker health check
        run: |
          cleanup() {
            docker logs xblago-space-smoke || true
            docker stop xblago-space-smoke || true
            docker volume rm xblago-integration-ci || true
          }
          trap cleanup EXIT

          if docker run --rm xblago-space:${{ github.sha }}; then
            echo 'Unconfigured integration image must fail closed'
            exit 1
          fi
          docker volume create xblago-integration-ci
          docker run --rm -v xblago-integration-ci:/lab -v "$PWD/tools:/synthetic-tools:ro" \
            --entrypoint python xblago-space:${{ github.sha }} \
            /synthetic-tools/integration_fixture.py --new-synthetic-root /lab/synthetic

          docker run --rm -d \
            -v xblago-integration-ci:/lab \
            -e XBLAGO_DATA_DIR=/lab/synthetic/app \
            -e XBLAGO_SECURITY_JOURNAL_DIR=/lab/synthetic/journal \
            -e XBLAGO_JOURNAL_WITNESS_DIR=/lab/synthetic/witness \
            -e XBLAGO_INTEGRATION_MODE=synthetic \
            -e XBLAGO_LLM_PROVIDER=local \
            -e XBLAGO_PILOT_MODE=true \
            -e XBLAGO_REQUIRE_SECURE_IDENTITY=true \
            -e XBLAGO_REQUIRE_PRIVACY_JOURNAL=true \
            --name xblago-space-smoke \
            -p 7860:7860 \
            -e TELEGRAM_BOT_TOKEN=123:ci-smoke-token \
            -e TELEGRAM_DELIVERY_MODE=webhook \
            -e TELEGRAM_WEBHOOK_URL=http://127.0.0.1:7860/telegram/ci-smoke \
            -e TELEGRAM_WEBHOOK_SECRET=ci-smoke \
            -e TELEGRAM_SKIP_STARTUP_CHECK=true \
            -e TELEGRAM_SKIP_WEBHOOK_REGISTRATION=true \
            -e XBLAGO_WEB_INVITE_CODE=ci-release-smoke-invite \
            -e XBLAGO_COOKIE_SECURE=false \
            xblago-space:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/healthz \
              && curl -fsS http://127.0.0.1:7860/app >/dev/null \
              && curl -fsS http://127.0.0.1:7860/app/manifest.webmanifest >/dev/null \
              && curl -fsS http://127.0.0.1:7860/app/sw.js >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          exit 1
      - name: Docker Identity Runtime smoke (temporary SQLite only)
        run: |
          docker run --rm -i --entrypoint python \
            -e XBLAGO_WEB_INVITE_CODE=ci-synthetic-identity-invite \
            -e XBLAGO_REQUIRE_SECURE_IDENTITY=true \
            xblago-space:${{ github.sha }} - <<'PY'
          import tempfile
          from pathlib import Path
          from xblago.core.storage import SQLiteBlagoStore
          from xblago.core.identity_schema import migrate_identity_store
          from xblago.core.identity_runtime_schema import migrate_identity_runtime
          from xblago.integrations.web import WebApp
          with tempfile.TemporaryDirectory() as root:
              path = Path(root) / 'ci-only.sqlite3'
              app = WebApp(SQLiteBlagoStore(path))
              migrate_identity_store(path)
              assert migrate_identity_runtime(path)
              assert not migrate_identity_runtime(path)
              token, csrf = app.register('ci_identity', 'ci-only-long-password', 'ci-synthetic-identity-invite')
              assert app.session(token)[1] == csrf
              assert len(app.identity.sessions(token)) == 1
              replacement, _ = app.login('ci_identity', 'ci-only-long-password', token)
              assert WebApp(SQLiteBlagoStore(path)).session(replacement)
              backup = app.store.backup_database()
              assert WebApp(SQLiteBlagoStore(backup)).session(replacement)
              print('Identity runtime, restart and backup smoke OK')
          PY
      - name: Docker Privacy Recovery smoke (temporary stores only)
        run: |
          docker run --rm -i --entrypoint python \
            -e XBLAGO_WEB_INVITE_CODE=ci-privacy-only-invite \
            xblago-space:${{ github.sha }} - <<'PY'
          import os, sqlite3, tempfile
          from pathlib import Path
          from xblago.core.storage import SQLiteBlagoStore
          from xblago.core.identity_schema import migrate_identity_store
          from xblago.core.identity_runtime_schema import migrate_identity_runtime
          from xblago.core.privacy_schema import migrate_privacy
          from xblago.core.security_journal import SecurityJournal
          from xblago.core.privacy_maintenance import restore, cleanup
          from xblago.integrations.web import WebApp
          from xblago.integrations.privacy import PrivacyService
          with tempfile.TemporaryDirectory() as root:
              path = Path(root) / 'ci-app.sqlite3'
              journal = Path(root) / 'independent-control'
              app = WebApp(SQLiteBlagoStore(path))
              migrate_identity_store(path)
              migrate_identity_runtime(path)
              SecurityJournal.initialize(journal)
              assert migrate_privacy(path, journal)
              os.environ['XBLAGO_SECURITY_JOURNAL_DIR'] = str(journal)
              os.environ['XBLAGO_REQUIRE_PRIVACY_JOURNAL'] = 'true'
              token, _ = app.register('privacy_ci', 'ci-privacy-long-password', 'ci-privacy-only-invite')
              uid = app.session(token)[0]
              app.store.memory_for_user(uid).set('city', 'Kazan')
              backup = app.store.backup_database()
              app.store.delete_memory(uid, 'city')
              recovered = restore(backup, journal)
              assert recovered.all_memory(uid) == {}
              replacement, _ = app.login('privacy_ci', 'ci-privacy-long-password')
              privacy = PrivacyService(app)
              assert privacy.export(replacement)['blago_user_id'] == uid
              preview = privacy.preview(replacement)
              assert privacy.delete(replacement, preview['challenge'], 'УДАЛИТЬ')['deleted']
              cleanup(app.store)
              assert WebApp(SQLiteBlagoStore(backup)).store.all_memory(uid) == {}
              SecurityJournal(journal).read()
              print('SQLite runtime:', sqlite3.sqlite_version)
              print('Privacy journal, export, delete, TTL and restore smoke OK')
          PY
      - name: Docker strict pilot gate and independent checkpoint
        run: |
          docker run --rm -i --entrypoint python xblago-space:${{ github.sha }} - <<'PY'
          import os, tempfile
          from pathlib import Path
          from xblago.core.storage import SQLiteBlagoStore
          from xblago.integrations.web import WebApp
          from xblago.core.identity_schema import migrate_identity_store
          from xblago.core.identity_runtime_schema import migrate_identity_runtime
          from xblago.core.privacy_schema import migrate_privacy
          from xblago.core.pilot_schema import migrate_pilot
          from xblago.core.security_journal import SecurityJournal
          from xblago.core.journal_witness import initialize
          from xblago.core.sqlite_safety import require_safe_sqlite
          with tempfile.TemporaryDirectory() as root:
              root = Path(root)
              path, journal, witness = root/'app.sqlite3', root/'journal', root/'witness'
              WebApp(SQLiteBlagoStore(path))
              migrate_identity_store(path)
              migrate_identity_runtime(path)
              SecurityJournal.initialize(journal)
              migrate_privacy(path, journal)
              os.environ['XBLAGO_SECURITY_JOURNAL_DIR'] = str(journal)
              migrate_pilot(path)
              initialize(SecurityJournal(journal), witness)
              os.environ['XBLAGO_JOURNAL_WITNESS_DIR'] = str(witness)
              os.environ['XBLAGO_PILOT_MODE'] = 'true'
              require_safe_sqlite()
              WebApp(SQLiteBlagoStore(path))
              SecurityJournal(journal).read()
              print('Strict pilot SQLite, lineage baseline and independent witness gate OK')
          PY
      - name: Docker natural conversation and bounded text repair
        run: |
          docker run --rm -i --entrypoint python xblago-space:${{ github.sha }} - <<'PY'
          import json, tempfile
          from pathlib import Path
          from unittest.mock import MagicMock, patch
          from xblago.core.config import LlmConfig
          from xblago.core.llm import OpenAICompatibleProvider
          from xblago.core.storage import SQLiteBlagoStore, TelegramIdentity
          from xblago.integrations.web import WebApp
          def completion(text, reason):
              response = MagicMock()
              response.__enter__.return_value = response
              response.read.return_value = json.dumps({'choices': [{'message': {'content': text}, 'finish_reason': reason}]}).encode()
              return response
          with tempfile.TemporaryDirectory() as root:
              store = SQLiteBlagoStore(Path(root)/'conversation.sqlite3')
              uid = store.resolve_telegram_user(TelegramIdentity(1000000001,1000000001,'private'))
              app = WebApp(store)
              provider = OpenAICompatibleProvider(LlmConfig('hf','synthetic','synthetic-key','https://example.invalid',7))
              with patch('xblago.integrations.web.build_chat_provider',return_value=provider), patch('xblago.core.llm.urllib.request.urlopen',side_effect=[completion('Проверь изно','length'),completion('Проверь износ цепи.','stop')]) as calls:
                  assert app.chat(uid,'Почему цепь перескакивает?') == 'Проверь износ цепи.'
              assert calls.call_count == 2
              assert len(store.recent_history(uid,100)) == 2
              assert store.all_memory(uid) == {}
              assert not app.rows('needs',uid)
              assert not app.rows('resources',uid)
              assert WebApp(SQLiteBlagoStore(store.path)).history(uid) == app.history(uid)
              print('Natural conversation, single text repair, atomic history and no economic actions smoke OK')
          PY
      - name: Docker Help 01 nonfinancial cycle
        run: |
          docker run --rm -v "$PWD/tools:/app/tools:ro" --entrypoint python \
            xblago-space:${{ github.sha }} -m tools.help_demo --output /tmp/help-demo.json
      - name: Docker Help 01.1 disposable lab parity smoke (no network)
        run: |
          docker run --rm --network none -i -v "$PWD/tools:/app/tools:ro" \
            --entrypoint python xblago-space:${{ github.sha }} - <<'PY'
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          import os
          from tools.help_readiness_lab import initialize, configuration
          from xblago.core.integration import preflight
          from xblago.core.sqlite_safety import require_safe_sqlite
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)/'synthetic'
              initialize(root)
              with patch.dict(os.environ, configuration(root)):
                  require_safe_sqlite()
                  with preflight(root/'app/blago.sqlite3')._connect() as db:
                      assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
                      assert db.execute('PRAGMA foreign_key_check').fetchall() == []
                      assert db.execute('PRAGMA journal_mode').fetchone()[0] == 'wal'
                      assert db.execute('PRAGMA synchronous').fetchone()[0] == 2
              print('Disposable nonfinancial Help lab: PASS; independent custody UNKNOWN')
          PY
      - name: Docker lifecycle replay smoke (synthetic, no network)
        run: |
          docker run --rm --network none -v "$PWD/tools:/app/tools:ro" --entrypoint python \
            xblago-space:${{ github.sha }} -m tools.lifecycle_check --output /tmp/lifecycle-check.json
      - name: Docker operational retention and reidentification (synthetic, no network)
        run: |
          docker run --rm --network none -v "$PWD/tools:/app/tools:ro" --entrypoint python \
            xblago-space:${{ github.sha }} -m tools.retention_ops_lab --output /tmp/retention-ops-lab.json
      - name: Docker Integration 02 unified localhost journey (synthetic, no network)
        run: |
          docker run --rm --network none -v "$PWD/tools:/app/tools:ro" --entrypoint python \
            xblago-space:${{ github.sha }} -m tools.unified_mvp_check --output /tmp/unified-mvp-check.json
      - name: Docker Collective Calculator offline accounting (synthetic, no network)
        run: |
          docker run --rm --network none -v "$PWD/tools:/app/tools:ro" --entrypoint python \
            xblago-space:${{ github.sha }} -m tools.collective_calculator_lab --output /tmp/calculator-lab.json

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xblago"
version = "0.1.0"
description = "The first xBLAGO personal assistant agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
xblago = "xblago.cli:main"
xblago-telegram = "xblago.integrations.telegram:main"

[tool.setuptools.packages.find]
where = ["src"]

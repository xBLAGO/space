[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xblago"
version = "0.1.0"
description = "The first xBLAGO personal assistant agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.2.2",
    "requests>=2.32",
    "webauthn==2.7.1",
    "cbor2>=5.6.5,<6",
    "cryptography>=44.0.2,<49",
    "PyNaCl==1.6.2",
    "pyOpenSSL>=25,<26.3",
]

[project.scripts]
xblago = "xblago.cli:main"
xblago-telegram = "xblago.integrations.telegram:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xblago.integrations" = ["static/*"]
